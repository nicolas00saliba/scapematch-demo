<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/">

  <meta charset="UTF-8">
  <!--
    O GitHub Pages não aplica _headers e não deixa escolher cabeçalhos.
    CSP e Referrer-Policy valem nesta meta. O navegador ignora
    frame-ancestors, sandbox e report-uri quando a CSP vem em meta, então
    eles não entram aqui. HSTS, X-Frame-Options, X-Content-Type-Options e o
    Access-Control-Allow-Origin: * do Pages não têm equivalente no HTML.
    O estilo some quando a janela não está num iframe. unsafe-eval e
    wasm-unsafe-eval são do dart2js e do CanvasKit (gstatic ou a pasta
    local). O mapa pede o tile do OpenStreetMap. A senha consulta a API
    do Pwned Passwords. O PagBank fica nas Edge Functions: o navegador só
    abre o PDF da nota, não chama a API. O CanvasKit baixa a Roboto e as
    Noto de fallback com fetch em fonts.gstatic.com/s/ — isso é
    connect-src. font-src continua 'self' e data:. O SDK JS do Sentry
    sai de sentry/11.0.0/ neste site, antes do Flutter. script-src não
    ganha origem nova. Quando o build recebe SENTRY_DSN, o envelope
    segue para *.ingest.sentry.io.
  -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com/flutter-canvaskit/ blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://eujlhicairvksvmssruz.supabase.co wss://eujlhicairvksvmssruz.supabase.co https://api.pwnedpasswords.com https://www.gstatic.com/flutter-canvaskit/ https://fonts.gstatic.com/s/ https://tile.openstreetmap.org https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; frame-src 'none'; manifest-src 'self'; form-action 'self'">
  <style id="scape-frame-guard">html{display:none !important}</style>
  <script>
    // Flutter já exige script. Enquanto esta janela for a de cima, o
    // estilo sai. Num iframe o conteúdo continua escondido: frame-ancestors
    // não funciona em meta, e o Pages não envia X-Frame-Options.
    (function () {
      if (window.top !== window.self) {
        try { window.top.location = window.self.location; } catch (e) {}
        return;
      }
      var guard = document.getElementById('scape-frame-guard');
      if (guard) guard.remove();
    })();
  </script>
  <script id="sentry-cdn-rewrite" src="sentry/sentry-cdn-rewrite.js"></script>
  <script id="sentry-sdk-local" src="sentry/11.0.0/bundle.tracing.min.js" integrity="sha384-TcpSGbL8WtdpR8lXDGGaurUtinn44aaUcN/5iratedpnLQZYJpnJlzK4pdS8sBn5" crossorigin="anonymous"></script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- O Pages não envia X-Robots-Tag. O noindex fica nesta meta. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="EscapeMatch ajuda a montar grupos para escape rooms. Esta versão usa dados de exemplo.">
  <meta name="scapematch-release" content="home-feed">

  <title>EscapeMatch Demo</title>

  <style>
    /* O arraste do mapa no Chrome do Android não recarrega a página. */
    html, body {
      overscroll-behavior: none;
      background: #FFFFFF;
    }
    #scape-splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
    }
    #scape-splash a {
      color: #0F4C4A;
      font-family: sans-serif;
      font-size: 16px;
    }
  </style>
  <script>
    // O Flutter 3.47 reescreve o viewport e tira o viewport-fit.
    // Sem cover, o iOS não informa a safe area do notch.
    (function () {
      function cover() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover');
          document.head.appendChild(meta);
          return;
        }
        var content = meta.getAttribute('content') || '';
        if (content.indexOf('viewport-fit=cover') !== -1) return;
        var next = content.replace(/,?\s*viewport-fit=[^,]+/gi, '').replace(/,\s*$/, '');
        meta.setAttribute('content', next + ', viewport-fit=cover');
      }
      cover();
      new MutationObserver(cover).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content']
      });
    })();
  </script>
  <script>
    // O Chrome dispara beforeinstallprompt uma vez. O app real guarda
    // o evento para o aviso "Instalar o app". A demonstração não leva
    // a meta scapematch-install e deixa o navegador mostrar o seu.
    (function () {
      window.scapeInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        var meta = document.querySelector('meta[name="scapematch-install"]');
        if (!meta || meta.getAttribute('content') !== 'real') return;
        event.preventDefault();
        window.scapeInstallPrompt = event;
        window.dispatchEvent(new Event('scape-install-prompt'));
      });
      window.scapeLaunchInstall = function () {
        var event = window.scapeInstallPrompt;
        if (!event || typeof event.prompt !== 'function') {
          return Promise.resolve('missing');
        }
        window.scapeInstallPrompt = null;
        return event.prompt().then(function () {
          return event.userChoice;
        }).then(function (choice) {
          return choice && choice.outcome ? choice.outcome : 'dismissed';
        });
      };
    })();
  </script>
  <meta name="scapematch-build" content="3b78396220ec">
  <script id="scape-version-check">
// Confere se esta aba ainda roda a versão publicada. Vale para o jogador, o
// Parceiro e o Admin. stamp_web_build.sh injeta este arquivo no index.html.
// Sem service worker, um app aberto há horas continuaria com o bundle antigo:
// o Flutter web é uma página só e não recarrega sozinho.
(function () {
  var meta = document.querySelector('meta[name="scapematch-build"]');
  var current = meta && meta.getAttribute('content');
  if (!current || current === 'dev' || !window.fetch) return;
  var MIN_GAP_MS = 60 * 1000;
  var EVERY_MS = 10 * 60 * 1000;
  var last = 0;
  var busy = false;
  var pending = false;

  function typing() {
    var el = document.activeElement;
    if (!el) return false;
    var tag = (el.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || el.isContentEditable === true;
  }

  function reload(next) {
    try {
      // Uma recarga por versão. Se a rede devolver um index velho, não entra em laço.
      if (sessionStorage.getItem('scape-build-reload') === next) return;
      sessionStorage.setItem('scape-build-reload', next);
    } catch (e) {}
    window.location.reload();
  }

  function check(force) {
    var now = Date.now();
    if (busy || (!force && now - last < MIN_GAP_MS)) return;
    busy = true;
    last = now;
    fetch(new URL('./', document.baseURI).href, {
      cache: 'no-store',
      credentials: 'omit',
      headers: {Accept: 'text/html'}
    }).then(function (res) {
      return res.ok ? res.text() : '';
    }).then(function (html) {
      var found = /<meta[^>]+name="scapematch-build"[^>]+content="([^"]+)"/.exec(html);
      if (!found || found[1] === current) {
        pending = false;
        return;
      }
      // Não recarrega com um campo em foco: o teclado e o que a pessoa digitou ficam.
      if (typing()) {
        pending = found[1];
        return;
      }
      reload(found[1]);
    }).catch(function () {}).then(function () {
      busy = false;
    });
  }

  function visible() {
    if (document.visibilityState !== 'visible') return;
    if (pending && !typing()) {
      reload(pending);
      return;
    }
    check(false);
  }

  document.addEventListener('visibilitychange', visible);
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) check(true);
  });
  window.addEventListener('online', function () { check(true); });
  window.addEventListener('focus', visible);
  setInterval(function () {
    if (document.visibilityState === 'visible') visible();
  }, EVERY_MS);
  // O index pode ter vindo do cache HTTP (até 10 min). Confere logo depois de abrir.
  setTimeout(function () { check(true); }, 4000);
})();
</script>
</head>
<body>
  <div id="scape-splash">
    <a href="https://escapematch.com.br/">Site oficial do EscapeMatch</a>
  </div>
  <script>
    // A abertura sai no primeiro frame. O link não fica atrás do canvas
    // nem na ordem do Tab depois que o app abre.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('scape-splash');
      if (splash) splash.remove();
    });
  </script>
  <script>
    // Um service worker antigo do jogador cobria /scapematch/ inteiro.
    // No Pages antigo, se este shell abrir num caminho do Parceiro,
    // solta esse worker e volta para o app da casa. Na demo, /parceiro/
    // não é mais o app: manda para o host próprio e não sobe o Flutter.
    // A conta do destino é a mesma de tool/parceiro_demo_redirect/redirect.js.
    (function () {
      var path = location.pathname;
      var marker = '/parceiro';
      var at = path.indexOf(marker);
      if (at < 0) return;
      var tail = path.slice(at + marker.length);
      if (tail !== '' && tail.charAt(0) !== '/') return;
      if (location.host === 'demo.escapematch.com.br') {
        window.scapeHoldFlutter = true;
        var rest = (tail === '' || tail === '/' ||
            tail === '/index.html' || tail === '/404.html') ? '/' : tail;
        var dest = 'https://parceiro-demo.escapematch.com.br' + rest +
            location.search + location.hash;
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) {
              if (reg.scope.indexOf(marker + '/') !== -1) return reg.unregister();
            }));
          });
        }
        location.replace(dest);
        return;
      }
      if (!('serviceWorker' in navigator)) return;
      if (sessionStorage.getItem('scape-partner-shell') === '1') return;
      sessionStorage.setItem('scape-partner-shell', '1');
      var home = path.slice(0, at + marker.length) + '/';
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) {
          if (reg.scope.indexOf(marker + '/') === -1) return reg.unregister();
        }));
      }).then(function () {
        location.replace(home);
      });
    })();
  </script>
  <script>
    // Não registra um worker novo. Se ainda houver um, pede a atualização
    // na hora: o arquivo publicado se desregistra e limpa o cache. No
    // caminho do Parceiro o script acima é quem solta o worker do jogador.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var path = location.pathname;
      var marker = '/parceiro';
      var at = path.indexOf(marker);
      if (at >= 0) {
        var tail = path.slice(at + marker.length);
        if (tail === '' || tail.charAt(0) === '/') return;
      }
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update();
      });
    })();
  </script>

  <script>
    if (!window.scapeHoldFlutter) {
      var boot = document.createElement('script');
      boot.src = 'flutter_bootstrap.js?v=3b78396220ec';
      boot.async = true;
      document.body.appendChild(boot);
    }
  </script>
</body>
